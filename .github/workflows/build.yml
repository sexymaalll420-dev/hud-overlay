name: build
on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: project files
        run: |
          mkdir -p app/src/main/java/com/venice/hud

          cat > settings.gradle.kts <<'XEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HudOverlay"
          include(":app")
          XEOF

          cat > build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          XEOF

          cat > gradle.properties <<'XEOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g
          XEOF

          cat > app/build.gradle.kts <<'XEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.venice.hud"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.venice.hud"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildTypes { release { isMinifyEnabled = false } }
          }
          XEOF

          cat > app/src/main/AndroidManifest.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="HUD Overlay"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".HudService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay_hud" />
                  </service>
              </application>
          </manifest>
          XEOF

          cat > app/src/main/java/com/venice/hud/Config.kt <<'XEOF'
          package com.venice.hud

          import android.content.Context

          data class Config(
              var crosshair: Boolean = true,
              var stats: Boolean = true,
              var timer: Boolean = true,
              var style: Int = 0,
              var size: Float = 34f,
              var thickness: Float = 3f,
              var gap: Float = 14f,
              var color: Int = 0xFF00E08A.toInt()
          ) {
              fun save(c: Context) {
                  c.getSharedPreferences("cfg", 0).edit()
                      .putBoolean("ch", crosshair).putBoolean("st", stats).putBoolean("tm", timer)
                      .putInt("sty", style).putFloat("sz", size).putFloat("th", thickness)
                      .putFloat("gp", gap).putInt("cl", color)
                      .apply()
              }

              companion object {
                  fun load(c: Context): Config {
                      val p = c.getSharedPreferences("cfg", 0)
                      return Config(
                          p.getBoolean("ch", true), p.getBoolean("st", true), p.getBoolean("tm", true),
                          p.getInt("sty", 0), p.getFloat("sz", 34f), p.getFloat("th", 3f),
                          p.getFloat("gp", 14f), p.getInt("cl", 0xFF00E08A.toInt())
                      )
                  }
              }
          }
          XEOF

          cat > app/src/main/java/com/venice/hud/MainActivity.kt <<'XEOF'
          package com.venice.hud

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var info: TextView

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(56, 90, 56, 56)
                      setBackgroundColor(0xFF0E1216.toInt())
                  }

                  root.addView(TextView(this).apply {
                      text = "HUD OVERLAY"
                      setTextColor(0xFF00E08A.toInt())
                      textSize = 27f
                      setTypeface(null, 1)
                  })

                  root.addView(TextView(this).apply {
                      text = "क्रॉसहेयर, टाइमर, FPS/RAM/CPU HUD — गेम के ऊपर फ्लोट करता है। कोई रूट नहीं, पूरा ऑफलाइन।"
                      setTextColor(0xFF8BA0AD.toInt())
                      textSize = 13f
                      setPadding(0, 18, 0, 26)
                  })

                  info = TextView(this).apply {
                      setTextColor(0xFFCFD8DC.toInt())
                      textSize = 14f
                      setPadding(0, 0, 0, 26)
                  }
                  root.addView(info)

                  root.addView(btn("Overlay परमिशन") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })

                  if (Build.VERSION.SDK_INT >= 33) {
                      root.addView(btn("Notification परमिशन") {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                      })
                  }

                  root.addView(btn("START HUD") { start() })
                  root.addView(btn("STOP") {
                      stopService(Intent(this, HudService::class.java))
                      Toast.makeText(this, "बंद", Toast.LENGTH_SHORT).show()
                  })

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  val overlay = Settings.canDrawOverlays(this)
                  info.text = "Overlay परमिशन: ${if (overlay) "मिल गई" else "नहीं मिली"}\n" +
                      "HUD: ${if (HudService.running) "चालू है" else "बंद है"}"
              }

              private fun start() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "पहले overlay परमिशन दो", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val i = Intent(this, HudService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  Toast.makeText(this, "HUD चालू — गेम खोलो", Toast.LENGTH_SHORT).show()
              }

              private fun btn(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  textSize = 15f
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = 22 }
              }
          }
          XEOF

          cat > app/src/main/java/com/venice/hud/HudService.kt <<'XEOF'
          package com.venice.hud

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.Choreographer
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import kotlin.math.max

          class CrosshairView(c: Context) : View(c) {

              var cfg: Config? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }

              override fun onDraw(canvas: Canvas) {
                  val c0 = cfg ?: return
                  if (!c0.crosshair) return

                  val cx = width / 2f
                  val cy = height / 2f
                  val gap = c0.gap * resources.displayMetrics.density
                  val len = c0.size * resources.displayMetrics.density

                  p.color = c0.color
                  p.strokeWidth = c0.thickness * resources.displayMetrics.density
                  p.style = Paint.Style.STROKE

                  when (c0.style) {
                      0 -> {
                          canvas.drawLine(cx - gap - len, cy, cx - gap, cy, p)
                          canvas.drawLine(cx + gap, cy, cx + gap + len, cy, p)
                          canvas.drawLine(cx, cy - gap - len, cx, cy - gap, p)
                          canvas.drawLine(cx, cy + gap, cx, cy + gap + len, p)
                      }
                      1 -> {
                          p.style = Paint.Style.FILL
                          canvas.drawCircle(cx, cy, max(2f, p.strokeWidth), p)
                          p.style = Paint.Style.STROKE
                      }
                      2 -> canvas.drawCircle(cx, cy, gap + len * 0.5f, p)
                      3 -> {
                          canvas.drawLine(cx - gap - len, cy, cx - gap, cy, p)
                          canvas.drawLine(cx + gap, cy, cx + gap + len, cy, p)
                          canvas.drawLine(cx, cy + gap, cx, cy + gap + len, p)
                      }
                  }

                  p.style = Paint.Style.FILL
                  canvas.drawCircle(cx, cy, max(1.5f, p.strokeWidth * 0.45f), p)
                  p.style = Paint.Style.STROKE
              }
          }

          object Stats {
              private var lastCpu = 0L
              private var lastIdle = 0L
              private var lastAt = 0L

              fun cpu(): Int {
                  return try {
                      val line = java.io.File("/proc/stat").readLines().firstOrNull { it.startsWith("cpu ") } ?: return -1
                      val v = line.trim().split(Regex("\\s+")).drop(1).mapNotNull { it.toLongOrNull() }
                      if (v.size < 4) return -1
                      val idle = v[3] + (v.getOrNull(4) ?: 0)
                      val total = v.sum()
                      val now = SystemClock.elapsedRealtime()
                      if (lastAt == 0L) { lastCpu = total; lastIdle = idle; lastAt = now; return -1 }
                      val dT = total - lastCpu
                      val dI = idle - lastIdle
                      val dt = now - lastAt
                      lastCpu = total; lastIdle = idle; lastAt = now
                      if (dT <= 0 || dt <= 0) return -1
                      (((dT - dI) * 100.0) / dT).toInt().coerceIn(0, 100)
                  } catch (e: Exception) { -1 }
              }

              fun ram(): String {
                  return try {
                      val lines = java.io.File("/proc/meminfo").readLines()
                      val total = lines.firstOrNull { it.startsWith("MemTotal") }
                          ?.filter { it.isDigit() }?.toLongOrNull() ?: return "--"
                      val avail = lines.firstOrNull { it.startsWith("MemAvailable") }
                          ?.filter { it.isDigit() }?.toLongOrNull() ?: return "--"
                      val used = (total - avail) / 1024
                      val pct = ((total - avail) * 100 / total)
                      "${used}MB / ${pct}%"
                  } catch (e: Exception) { "--" }
              }
          }

          class HudService : Service() {

              private lateinit var wm: WindowManager
              private var panel: View? = null
              private var cross: CrosshairView? = null
              private lateinit var cfg: Config

              private lateinit var statsTv: TextView
              private lateinit var timerTv: TextView
              private var started = 0L
              private var pausedAt = 0L

              private var frames = 0
              private var fps = 0
              private var lastFpsAt = 0L

              private val handler = Handler()

              override fun onCreate() {
                  super.onCreate()
                  running = true
                  startForeground(1, notification())
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  cfg = Config.load(this)
                  addCrosshair()
                  addPanel()
                  loop()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun addCrosshair() {
                  val v = CrosshairView(this)
                  v.cfg = cfg
                  cross = v
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(v, lp)
              }

              private fun addPanel() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(12))
                      setBackgroundColor(0xE6101418.toInt())
                  }

                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  bar.addView(TextView(this).apply {
                      text = "HUD"
                      setTextColor(0xFF00E08A.toInt())
                      textSize = 15f
                      setTypeface(null, 1)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  })
                  bar.addView(TextView(this).apply {
                      text = "X"
                      setTextColor(0xFFFF5252.toInt())
                      textSize = 16f
                      setPadding(dp(8), 0, dp(4), 0)
                      setOnClickListener { stopSelf() }
                  })
                  root.addView(bar)

                  timerTv = TextView(this).apply {
                      text = "00:00.0"
                      setTextColor(Color.WHITE)
                      textSize = 22f
                      setTypeface(null, 1)
                  }
                  root.addView(timerTv)

                  val tb = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  tb.addView(small(">") { if (started == 0L) started = SystemClock.elapsedRealtime() - pausedAt; pausedAt = 0 })
                  tb.addView(small("||") { if (started != 0L && pausedAt == 0L) { pausedAt = SystemClock.elapsedRealtime() - started; started = 0L } })
                  tb.addView(small("R") { started = 0L; pausedAt = 0 })
                  root.addView(tb)

                  statsTv = TextView(this).apply {
                      setTextColor(0xFF90A4AE.toInt())
                      textSize = 11f
                      setPadding(0, dp(6), 0, dp(4))
                  }
                  root.addView(statsTv)

                  root.addView(sw("Crosshair", cfg.crosshair) { cfg.crosshair = it; cfg.save(this); cross?.invalidate() })
                  root.addView(sw("Stats", cfg.stats) { cfg.stats = it; cfg.save(this) })
                  root.addView(sw("Timer", cfg.timer) { cfg.timer = it; cfg.save(this) })

                  root.addView(label("Style"))
                  root.addView(seek(3, cfg.style) { cfg.style = it; cfg.save(this); cross?.invalidate() })
                  root.addView(label("Size"))
                  root.addView(seek(80, cfg.size.toInt()) { cfg.size = it.toFloat(); cfg.save(this); cross?.invalidate() })
                  root.addView(label("Thickness"))
                  root.addView(seek(12, cfg.thickness.toInt()) { cfg.thickness = it.toFloat(); cfg.save(this); cross?.invalidate() })
                  root.addView(label("Gap"))
                  root.addView(seek(40, cfg.gap.toInt()) { cfg.gap = it.toFloat(); cfg.save(this); cross?.invalidate() })

                  val colors = intArrayOf(0xFF00E08A.toInt(), 0xFFFF3B30.toInt(), 0xFF00D8FF.toInt(), 0xFFFFFFFF.toInt(), 0xFFFFD600.toInt())
                  val cr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(8), 0, 0) }
                  for (c in colors) {
                      cr.addView(View(this).apply {
                          setBackgroundColor(c)
                          layoutParams = LinearLayout.LayoutParams(dp(30), dp(22)).apply { rightMargin = dp(8) }
                          setOnClickListener { cfg.color = c; cfg.save(this@HudService); cross?.invalidate() }
                      })
                  }
                  root.addView(cr)

                  val lp = WindowManager.LayoutParams(
                      dp(210),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(16)
                  lp.y = dp(120)

                  var dx = 0
                  var dy = 0
                  bar.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX.toInt() - lp.x; dy = e.rawY.toInt() - lp.y; true }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = e.rawX.toInt() - dx
                              lp.y = e.rawY.toInt() - dy
              
